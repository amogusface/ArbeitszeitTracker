<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArbeitsZeit Tracker - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand">ArbeitsZeit Tracker</span>
            <div id="user-info" class="d-flex align-items-center">
                <button id="btn-login" class="btn btn-primary btn-sm">Anmelden</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="login-container" class="text-center py-5">
            <h2>Willkommen beim Dashboard</h2>
            <p>Bitte melde dich an, um deine Arbeitszeiten zu sehen.</p>
            <button id="btn-google" class="btn btn-outline-primary m-2">Mit Google anmelden</button>
            <button id="btn-microsoft" class="btn btn-outline-dark m-2">Mit Microsoft anmelden</button>
        </div>

        <div id="dashboard" class="d-none">
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card p-3 text-center">
                        <h5>Überstunden gesamt</h5>
                        <h2 id="total-overtime">0 min</h2>
                    </div>
                </div>
            </div>

            <div class="card p-4">
                <h4 class="mb-3">Deine Sitzungen</h4>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Datum</th>
                                <th>Beginn</th>
                                <th>Ende</th>
                                <th>Dauer</th>
                            </tr>
                        </thead>
                        <tbody id="sessions-table">
                            <!-- Daten werden hier eingefügt -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Konfiguration (wird automatisch von Hosting ausgefüllt)
        // Für lokale Tests hier deine Daten aus google-services.json eintragen:
        const firebaseConfig = {
            apiKey: "AIzaSyC_nv0B5kpzpg7YtFAbF6XUFPh6Ur4HnZs",
            authDomain: "arbeitszeit-tracker-84b4a.firebaseapp.com",
            projectId: "arbeitszeit-tracker-84b4a",
            storageBucket: "arbeitszeit-tracker-84b4a.firebasestorage.app",
            messagingSenderId: "146936274230",
            appId: "1:146936274230:web:95131520cfc6d565e12797" // Hinweis: Erstelle eine Web-App in Firebase Console für diese ID
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const btnGoogle = document.getElementById('btn-google');
        const btnMicrosoft = document.getElementById('btn-microsoft');
        const loginContainer = document.getElementById('login-container');
        const dashboard = document.getElementById('dashboard');
        const userInfo = document.getElementById('user-info');
        const sessionsTable = document.getElementById('sessions-table');

        // Login Logic
        btnGoogle.onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        btnMicrosoft.onclick = () => signInWithPopup(auth, new OAuthProvider('microsoft.com'));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginContainer.classList.add('d-none');
                dashboard.classList.remove('d-none');
                userInfo.innerHTML = `<span>${user.email}</span> <button class="btn btn-link btn-sm" onclick="auth.signOut()">Abmelden</button>`;
                loadData(user.uid);
            } else {
                loginContainer.classList.remove('d-none');
                dashboard.classList.add('d-none');
                userInfo.innerHTML = `<button id="btn-login" class="btn btn-primary btn-sm">Anmelden</button>`;
            }
        });

        function loadData(uid) {
            // Lade Sessions
            const q = query(collection(db, "users", uid, "sessions"), orderBy("startTime", "desc"));
            onSnapshot(q, (snapshot) => {
                sessionsTable.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const start = new Date(data.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const end = new Date(data.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const duration = Math.round((data.endTime - data.startTime) / 60000);

                    const row = `<tr>
                        <td>${data.date}</td>
                        <td>${start}</td>
                        <td>${end}</td>
                        <td>${duration} min</td>
                    </tr>`;
                    sessionsTable.innerHTML += row;
                });
            });
        }
    </script>
</body>
</html>
